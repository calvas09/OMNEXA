<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07080b">
<title>OMNEXA</title>

<style>
:root{
  --b:#07080b;
  --p:#101218;
  --l:#252936;
  --m:#9aa0ad;
  --a:#805cff;
  --t:#20d6b5
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--b);
  color:#f7f7fb;
  font:15px system-ui,-apple-system,sans-serif
}

header{
  height:70px;
  padding:0 5%;
  border-bottom:1px solid var(--l);
  display:flex;
  align-items:center;
  gap:28px;
  position:sticky;
  top:0;
  background:#07080bf2;
  backdrop-filter:blur(12px);
  z-index:5
}

.logo{
  font-size:25px;
  font-weight:950;
  color:#fff;
  text-decoration:none
}

.logo b{color:var(--a)}

nav{
  display:flex;
  gap:20px;
  flex:1
}

nav a{
  color:#aeb3bf;
  text-decoration:none;
  font-weight:650
}

nav a:hover{color:#fff}

.wrap{
  max-width:1400px;
  margin:auto;
  padding:0 5%
}

.hero{
  padding:65px 0 35px
}

.ey{
  color:var(--t);
  letter-spacing:2px;
  font-size:12px;
  font-weight:900
}

h1{
  font-size:clamp(42px,6vw,72px);
  line-height:.95;
  letter-spacing:-3px;
  margin:12px 0 18px
}

.muted{
  color:var(--m);
  line-height:1.6
}

.search{
  display:flex;
  gap:10px;
  max-width:900px;
  margin-top:25px
}

.search input{
  flex:1;
  padding:16px;
  border-radius:13px;
  border:1px solid #303440;
  background:#11131a;
  color:#fff;
  font-size:16px;
  outline:none
}

.search input:focus{
  border-color:var(--a)
}

.search button,
.chip{
  border:0;
  border-radius:12px;
  background:var(--a);
  color:#fff;
  padding:13px 18px;
  font-weight:850;
  cursor:pointer
}

.search button:hover{
  filter:brightness(1.12)
}

.chips{
  display:flex;
  gap:9px;
  margin-top:15px;
  flex-wrap:wrap
}

.chip{
  background:#11131a;
  border:1px solid #292d39;
  text-decoration:none
}

.chip:hover{
  border-color:var(--a)
}

.sec{
  margin:35px 0 55px
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(165px,1fr));
  gap:17px
}

.card{
  background:var(--p);
  border:1px solid var(--l);
  border-radius:15px;
  overflow:hidden;
  text-decoration:none;
  color:#fff;
  transition:.2s
}

.card:hover{
  transform:translateY(-4px);
  border-color:#4b5264
}

.card img{
  width:100%;
  aspect-ratio:2/3;
  object-fit:cover;
  background:#11131a;
  display:block
}

.cb{
  padding:12px
}

.cb b{
  display:block;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.meta{
  color:var(--m);
  font-size:12px;
  margin-top:6px
}

.empty{
  padding:35px 0;
  color:var(--m)
}

.err{
  padding:15px;
  background:#2b151d;
  border:1px solid #592430;
  border-radius:12px;
  color:#ffccd5
}

.detail{
  display:grid;
  grid-template-columns:290px 1fr;
  gap:34px;
  padding:55px 0
}

.detail img{
  width:100%;
  border-radius:18px
}

.detail h1{
  font-size:52px
}

.detail p{
  color:#c2c6cf;
  line-height:1.75
}

.offer{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px;
  margin:8px 0;
  background:#11131a;
  border:1px solid var(--l);
  border-radius:12px
}

.offer a{
  background:#fff;
  color:#000;
  padding:8px 12px;
  border-radius:9px;
  text-decoration:none;
  font-weight:800
}

.loading{
  padding:30px 0;
  color:var(--m)
}

@media(max-width:760px){

  nav{display:none}

  .wrap{
    padding:0 4%
  }

  .hero{
    padding:42px 0 25px
  }

  .search{
    flex-direction:column
  }

  .search button{
    height:50px
  }

  .grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:12px
  }

  .detail{
    grid-template-columns:1fr;
    padding:35px 0
  }

  .detail img{
    max-width:240px
  }

  .detail h1{
    font-size:39px
  }
}
</style>
</head>

<body>

<header>
  <a class="logo" href="#/">OMN<b>EXA</b></a>

  <nav>
    <a href="#/">Inicio</a>
    <a href="#/buscar">Buscar</a>
    <a href="#/descubrir">Descubrir</a>
  </nav>
</header>

<main class="wrap" id="app"></main>

<script>

const API =
"https://uribdulsfbrimmzhonmo.supabase.co/functions/v1/omnexa-api";

const PUBLIC_KEY =
"sb_publishable_aeZgvIGIwXKVxNK6nQIZ8g_kAlQu9Wy";

const app =
document.getElementById("app");


/* =========================
   UTILIDADES
========================= */

const esc = s =>
String(s ?? "")
.replace(/[&<>"']/g,c=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
}[c]));


const poster = x =>
x?.poster_url ||
x?.poster ||
"https://placehold.co/500x750/11131a/ffffff?text=OMNEXA";


/* =========================
   API OMNEXA
========================= */

async function api(action,x={}){

  const payload = {
    action,
    region:"DO",
    ...x
  };

  const r = await fetch(API,{
    method:"POST",

    headers:{
      "Content-Type":"application/json",
      "apikey":PUBLIC_KEY,
      "Authorization":"Bearer "+PUBLIC_KEY
    },

    body:JSON.stringify(payload)
  });


  const text = await r.text();

  let d={};

  try{
    d = text ? JSON.parse(text) : {};
  }catch{
    d = {
      error:text || "Respuesta inválida del servidor"
    };
  }


  if(!r.ok){

    throw new Error(
      d?.error ||
      d?.message ||
      "Error OMNEXA"
    );
  }

  return d;
}


/* =========================
   NORMALIZAR RESPUESTAS
========================= */

function normalizeResults(d){

  if(Array.isArray(d))
    return d;

  if(Array.isArray(d?.results))
    return d.results;

  if(Array.isArray(d?.data))
    return d.data;

  if(Array.isArray(d?.data?.results))
    return d.data.results;

  if(Array.isArray(d?.titles))
    return d.titles;

  if(Array.isArray(d?.items))
    return d.items;

  return [];
}


function resultCount(d,a){

  return Number(
    d?.result_count ??
    d?.data?.result_count ??
    a.length
  ) || 0;
}


/* =========================
   TARJETAS
========================= */

function cards(a){

  const arr = Array.isArray(a) ? a : [];

  if(!arr.length){

    return `
      <div class="empty">
        No encontramos títulos para mostrar.
      </div>
    `;
  }


  return `
    <div class="grid">

      ${arr.map(x=>{

        const id =
          x.id ??
          x.title_id ??
          "";

        const title =
          x.title ??
          x.name ??
          "Sin título";

        const year =
          x.year ??
          (
            x.release_date
            ? String(x.release_date).slice(0,4)
            : ""
          );

        const rating =
          x.rating ??
          x.vote_average ??
          "";

        const match =
          x.match_score;

        return `

          <a
            class="card"
            href="#/title/${encodeURIComponent(id)}"
          >

            <img
              loading="lazy"
              src="${esc(poster(x))}"
              alt="${esc(title)}"
              onerror="this.src='https://placehold.co/500x750/11131a/ffffff?text=OMNEXA'"
            >

            <div class="cb">

              <b>${esc(title)}</b>

              <div class="meta">

                ${esc(year)}

                ${rating
                  ? " · ⭐ "+esc(rating)
                  : ""
                }

                ${match
                  ? " · "+Math.round(match*100)+"% Match"
                  : ""
                }

              </div>

            </div>

          </a>

        `;

      }).join("")}

    </div>
  `;
}


/* =========================
   FORMULARIO
========================= */

function form(q="",ai=false){

  return `

    <form class="search" id="sf">

      <input
        name="q"
        value="${esc(q)}"
        autocomplete="off"
        placeholder="${
          ai
          ? "Describe lo que quieres ver…"
          : "Película, serie, anime, actor…"
        }"
      >

      <button type="submit">
        ${
          ai
          ? "✨ Buscar con IA"
          : "Buscar"
        }
      </button>

    </form>

  `;
}


/* =========================
   INICIO
========================= */

async function home(){

  app.innerHTML = `

    <section class="hero">

      <div class="ey">
        TODO LO QUE QUIERES VER
      </div>

      <h1>
        Una búsqueda.<br>
        Todo el entretenimiento.
      </h1>

      <p class="muted">
        Películas, series y anime.
        Descubre dónde verlo, qué tienes disponible
        y qué ver después.
      </p>

      ${form()}

      <div class="chips">

        <a
          class="chip"
          href="#/buscar?q=Mushoku%20Tensei"
        >
          Probar Mushoku Tensei
        </a>

        <a
          class="chip"
          href="#/buscar?ai=1&q=anime%20oscuro"
        >
          ✨ IA OMNEXA
        </a>

        <a
          class="chip"
          href="#/descubrir"
        >
          Descubrir
        </a>

      </div>

    </section>

    <div id="out" class="loading">
      Cargando catálogo…
    </div>

  `;


  document.getElementById("sf").onsubmit = e => {

    e.preventDefault();

    const q =
      String(
        new FormData(e.target).get("q") || ""
      ).trim();

    if(!q) return;

    location.hash =
      "#/buscar?q="+
      encodeURIComponent(q);

  };


  try{

    const d =
      await api("home_feed",{limit:12});


    const sections =
      d?.sections ??
      d?.data?.sections ??
      {};


    const forYou =
      sections?.for_you ??
      [];

    const free =
      sections?.free ??
      [];

    const myServices =
      sections?.my_services ??
      [];


    document.getElementById("out").innerHTML = `

      ${
        forYou.length
        ? `
          <section class="sec">
            <h2>Para ti</h2>
            ${cards(forYou)}
          </section>
        `
        : ""
      }


      ${
        free.length
        ? `
          <section class="sec">
            <h2>Gratis</h2>
            ${cards(free)}
          </section>
        `
        : ""
      }


      ${
        myServices.length
        ? `
          <section class="sec">
            <h2>En tus servicios</h2>
            ${cards(myServices)}
          </section>
        `
        : ""
      }


      ${
        !forYou.length &&
        !free.length &&
        !myServices.length
        ? `
          <div class="empty">
            El catálogo está disponible,
            pero todavía no hay contenido para mostrar
            en esta sección.
          </div>
        `
        : ""
      }

    `;

  }catch(e){

    document.getElementById("out").innerHTML = `

      <div class="err">

        ${esc(e.message)}

      </div>

    `;

  }

}


/* =========================
   BUSQUEDA
========================= */

async function search(){

  const p =
    new URLSearchParams(
      location.hash.split("?")[1] || ""
    );


  const q =
    String(p.get("q") || "").trim();

  const ai =
    p.get("ai")==="1";


  app.innerHTML = `

    <section class="hero">

      <div class="ey">
        ${
          ai
          ? "OMNEXA AI"
          : "BÚSQUEDA UNIVERSAL"
        }
      </div>

      <h1>
        Encuentra qué ver.
      </h1>

      ${form(q,ai)}

    </section>

    <div id="out" class="loading"></div>

  `;


  document.getElementById("sf").onsubmit = e => {

    e.preventDefault();

    const z =
      String(
        new FormData(e.target).get("q") || ""
      ).trim();


    if(!z) return;


    location.hash =
      "#/buscar?q="+
      encodeURIComponent(z)+
      (ai ? "&ai=1" : "");

  };


  if(!q){

    document.getElementById("out").innerHTML = `

      <div class="empty">
        Escribe un título, actor
        o describe lo que quieres ver.
      </div>

    `;

    return;
  }


  try{

    const d =
      await api(
        ai
        ? "ai_search"
        : "search",
        {
          query:q,
          limit:30
        }
      );


    const results =
      normalizeResults(d);


    document.getElementById("out").innerHTML = `

      <p class="muted">

        ${resultCount(d,results)}
        resultados

      </p>

      ${cards(results)}

    `;

  }catch(e){

    document.getElementById("out").innerHTML = `

      <div class="err">

        ${esc(e.message)}

      </div>

    `;

  }

}


/* =========================
   FICHA DEL TITULO
========================= */

async function detail(id){

  app.innerHTML = `

    <div class="loading">
      Cargando ficha…
    </div>

  `;


  try{

    const d =
      await api(
        "title",
        {
          title_id:id
        }
      );


    const t =
      d?.title ??
      d?.data?.title ??
      d;


    const offers =
      d?.offers ??
      d?.data?.offers ??
      t?.offers ??
      t?.availability ??
      [];


    const title =
      t?.title ??
      "Sin título";


    const type =
      t?.type ??
      "TÍTULO";


    const year =
      t?.year ??
      (
        t?.release_date
        ? String(t.release_date).slice(0,4)
        : ""
      );


    app.innerHTML = `

      <div class="detail">

        <div>

          <img
            src="${esc(poster(t))}"
            alt="${esc(title)}"
            onerror="this.src='https://placehold.co/500x750/11131a/ffffff?text=OMNEXA'"
          >

        </div>


        <div>

          <div class="ey">
            ${esc(type)}
          </div>


          <h1>
            ${esc(title)}
          </h1>


          <div class="muted">

            ${esc(year)}

            ${
              t?.rating
              ? " · ⭐ "+esc(t.rating)
              : ""
            }

          </div>


          <p>

            ${esc(
              t?.synopsis ||
              "Sin sinopsis disponible."
            )}

          </p>


          <h2>
            Dónde verlo
          </h2>


          ${
            offers.length

            ?

            offers.map(x=>`

              <div class="offer">

                <span>

                  <b>
                    ${esc(
                      x.provider_name ||
                      x.provider ||
                      "Servicio"
                    )}
                  </b>

                  <br>

                  <small class="muted">

                    ${esc(
                      x.offer_type ||
                      ""
                    )}

                  </small>

                </span>


                <a
                  target="_blank"
                  rel="noopener"
                  href="${esc(
                    x.deeplink ||
                    x.url ||
                    "#"
                  )}"
                >
                  Ver
                </a>

              </div>

            `).join("")

            :

            `

              <div class="empty">

                Sin disponibilidad
                registrada en RD.

              </div>

            `

          }

        </div>

      </div>

    `;

  }catch(e){

    app.innerHTML = `

      <div class="err">

        ${esc(e.message)}

      </div>

    `;

  }

}


/* =========================
   DESCUBRIR
========================= */

async function discover(){

  app.innerHTML = `

    <section class="hero">

      <div class="ey">
        DESCUBRIR
      </div>

      <h1>
        Tu próxima obsesión.
      </h1>

      <p class="muted">
        Catálogo disponible para
        República Dominicana.
      </p>

    </section>

    <div id="out" class="loading">
      Cargando…
    </div>

  `;


  try{

    const d =
      await api(
        "discover",
        {
          limit:40
        }
      );


    const results =
      normalizeResults(d);


    document.getElementById("out").innerHTML =
      cards(results);


  }catch(e){

    document.getElementById("out").innerHTML = `

      <div class="err">

        ${esc(e.message)}

      </div>

    `;

  }

}


/* =========================
   ROUTER
========================= */

function route(){

  const h =
    location.hash || "#/";


  if(h.startsWith("#/title/")){

    return detail(
      decodeURIComponent(
        h.split("/")[2]
      )
    );

  }


  if(h.startsWith("#/buscar")){

    return search();

  }


  if(h.startsWith("#/descubrir")){

    return discover();

  }


  return home();

}


/* =========================
   ARRANQUE
========================= */

addEventListener(
  "hashchange",
  route
);

route();

</script>

</body>
</html>
